version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: backup_db
    volumes:
      - db_data:/var/lib/mysql               
      - ./db_init:/docker-entrypoint-initdb.d
    networks:
      - app_network

  visualizzazione:
    build: ./visualizzazione                    
    restart: always
    ports:
      - "5000:5000"   
    environment:
      - DB_HOST=db   
      - DB_PASSWORD=root
    depends_on:
      - db   
    networks:
      - app_network

  backup:
    build: ./applicazione_backup
    restart: always
    ports:
      - "5001:5001"
    environment:
      - DB_HOST=db
      - DB_PASSWORD=root
    volumes:
      - shared_backups:/shared_backups
    depends_on:
      - db
    networks:
      - app_network
volumes:
  db_data:
  shared_backups:

networks:
  app_network:
    driver: bridge
